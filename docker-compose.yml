services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: class_coach
      POSTGRES_PASSWORD: class_coach
      POSTGRES_DB: class_coach
    ports:
      - "54329:5432"
    volumes:
      - class_coach_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U class_coach -d class_coach"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  class_coach_pg:
